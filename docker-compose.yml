services:
  # ============================
  # POSTGIS DATABASE
  # ============================
  db:
    image: postgis/postgis:15-3.4
    container_name: trackbuild_db
    restart: always
    environment:
      POSTGRES_DB: trackbuild
      POSTGRES_USER: fennec
      POSTGRES_PASSWORD: rfox06
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fennec -d trackbuild"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================
  # DJANGO BACKEND
  # ============================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trackbuild_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://fennec:rfox06@db:5432/trackbuild
      SECRET_KEY: replace-me-with-a-secure-key
      DEBUG: "True"
    ports:
      - "8081:8000"
    volumes:
      - .:/app

# Frontend build context removed from compose to avoid build failures
# Add it back if you have a frontend/ folder with a Dockerfile.

volumes:
  postgres_data: