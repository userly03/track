services:
  db:
    image: postgis/postgis:15-3.4
    container_name: trackbuild_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trackbuild}
      POSTGRES_USER: ${POSTGRES_USER:-fennec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rfox06}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-fennec} -d ${POSTGRES_DB:-trackbuild}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./Back-end
      dockerfile: Dockerfile
    container_name: trackbuild_backend
    restart: unless-stopped
    env_file:
      - ./Back-end/.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fennec}:${POSTGRES_PASSWORD:-rfox06}@db:5432/${POSTGRES_DB:-trackbuild}
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-trackbuild}
      POSTGRES_USER: ${POSTGRES_USER:-fennec}
      DEBUG: "True"
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-False}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
    ports:
      - "${BACKEND_PORT:-8081}:8000"
    volumes:
      - ./Back-end:/app
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; connection = socket.create_connection(('127.0.0.1', 8000), 2); connection.close()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./Front-end
      dockerfile: Dockerfile
    container_name: trackbuild_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8081}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    profiles:
      - frontend

volumes:
  postgres_data:
